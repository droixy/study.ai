// ─── Parse AI response into flashcard objects ───
function parseFlashcards(text) {
  const cards = [];
  // Match patterns like **Q:** ... **A:** ... or Q: ... A: ...
  const regex = /\*{0,2}Q:\*{0,2}\s*(.*?)(?:\n+)\*{0,2}A:\*{0,2}\s*(.*?)(?=\n\n\*{0,2}Q:|\n\n\*{0,2}Q:|\n\*{0,2}Q:|$)/gis;
  let match;
  while ((match = regex.exec(text)) !== null) {
    const q = match[1].trim().replace(/\*\*/g, "");
    const a = match[2].trim().replace(/\*\*/g, "");
    if (q && a) {
      cards.push({ id: cards.length, question: q, answer: a, status: "unseen" });
    }
  }
  // Fallback: try splitting by numbered Q/A
  if (cards.length === 0) {
    const lines = text.split("\n").filter(l => l.trim());
    let currentQ = null;
    for (const line of lines) {
      const qMatch = line.match(/^(?:\d+[\.\)]\s*)?(?:\*{0,2})Q(?:uestion)?(?:\*{0,2})?[:\s]+(.+)/i);
      const aMatch = line.match(/^(?:\*{0,2})A(?:nswer)?(?:\*{0,2})?[:\s]+(.+)/i);
      if (qMatch) { currentQ = qMatch[1].trim().replace(/\*\*/g, ""); }
      else if (aMatch && currentQ) {
        cards.push({ id: cards.length, question: currentQ, answer: aMatch[1].trim().replace(/\*\*/g, ""), status: "unseen" });
        currentQ = null;
      }
    }
  }
  return cards;
}

  const [flipped, setFlipped] = useState(false);
  const [mode, setMode] = useState("study"); // study | results
  const [studyQueue, setStudyQueue] = useState(initialCards.map((_, i) => i));

  const knownCards = cards.filter(c => c.status === "known");
  const studyAgainCards = cards.filter(c => c.status === "study-again");
  const unseenCards = cards.filter(c => c.status === "unseen");
  const currentQueuePos = studyQueue.indexOf(currentIndex);
  const currentCard = cards[currentIndex];
  const progress = cards.length > 0 ? ((cards.length - unseenCards.length) / cards.length) * 100 : 0;

  const markCard = (status) => {
    const updated = cards.map((c, i) => i === currentIndex ? { ...c, status } : c);
    setCards(updated);
    setFlipped(false);

    // Move to next card in queue
    const remaining = studyQueue.filter((idx, qPos) => {
      if (qPos <= currentQueuePos) return false;
      return true;
    });

    if (remaining.length > 0) {
      setTimeout(() => setCurrentIndex(remaining[0]), 200);
    } else {
      // Check if there are "study-again" cards to review
      const studyAgainIdxs = updated
        .map((c, i) => c.status === "study-again" ? i : -1)
        .filter(i => i !== -1);
      if (studyAgainIdxs.length > 0) {
        setStudyQueue(studyAgainIdxs);
        setTimeout(() => setCurrentIndex(studyAgainIdxs[0]), 200);
      } else {
        setTimeout(() => setMode("results"), 300);
      }
    }
  };

  const restartDeck = () => {
    setCards(initialCards.map(c => ({ ...c, status: "unseen" })));
    setStudyQueue(initialCards.map((_, i) => i));
    setCurrentIndex(0);
    setFlipped(false);
    setMode("study");
  };

  const studyMissedOnly = () => {
    const missed = cards.map((c, i) => c.status === "study-again" ? i : -1).filter(i => i !== -1);
    if (missed.length === 0) return;
    setCards(cards.map(c => c.status === "study-again" ? { ...c, status: "unseen" } : c));
    setStudyQueue(missed);
    setCurrentIndex(missed[0]);
    setFlipped(false);
    setMode("study");
  };

  if (mode === "results") {
    return (
      <div style={{
        background: t.card, borderRadius: 20, padding: "40px 32px",
        border: `1px solid ${t.border}`, maxWidth: 520, margin: "0 auto",
        textAlign: "center", boxShadow: t.cardShadow,
      }}>
        <div style={{ fontSize: 56, marginBottom: 16 }}>🎉</div>
        <h3 style={{ fontSize: 24, fontWeight: 800, color: t.text, marginBottom: 8 }}>Session Complete!</h3>
        <p style={{ color: t.textMuted, fontSize: 14, marginBottom: 28 }}>{deckTitle}</p>

        <div style={{ display: "flex", gap: 16, justifyContent: "center", marginBottom: 28 }}>
          <div style={{
            background: `${t.success}15`, borderRadius: 14, padding: "16px 24px",
            border: `1px solid ${t.success}30`, minWidth: 100,
          }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: t.success }}>{knownCards.length}</div>
            <div style={{ fontSize: 11, color: t.success, fontWeight: 600, marginTop: 4 }}>Known</div>
          </div>
          <div style={{
            background: `${t.danger}15`, borderRadius: 14, padding: "16px 24px",
            border: `1px solid ${t.danger}30`, minWidth: 100,
          }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: t.danger }}>{studyAgainCards.length}</div>
            <div style={{ fontSize: 11, color: t.danger, fontWeight: 600, marginTop: 4 }}>Review</div>
          </div>
        </div>

        <div style={{
          height: 8, background: t.inputBg, borderRadius: 4, overflow: "hidden", marginBottom: 28,
        }}>
          <div style={{
            width: `${cards.length > 0 ? (knownCards.length / cards.length) * 100 : 0}%`,
            height: "100%", background: t.success, borderRadius: 4, transition: "width 0.5s",
          }} />
        </div>

        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center" }}>
          {studyAgainCards.length > 0 && (
            <button onClick={studyMissedOnly} style={{
              padding: "12px 24px", borderRadius: 12, border: "none",
              background: `${t.danger}15`, color: t.danger, fontSize: 14, fontWeight: 600,
              cursor: "pointer", fontFamily: "'Poppins', sans-serif",
            }}>Study Missed ({studyAgainCards.length})</button>
          )}
          <button onClick={restartDeck} style={{
            padding: "12px 24px", borderRadius: 12, border: `1px solid ${t.border}`,
            background: "transparent", color: t.textMuted, fontSize: 14, fontWeight: 600,
            cursor: "pointer", fontFamily: "'Poppins', sans-serif",
          }}>Restart All</button>
          {onSaveNote && (
            <button onClick={() => {
              const content = cards.map(c => `Q: ${c.question}\nA: ${c.answer}`).join("\n\n");
              onSaveNote({
                id: Date.now(), title: deckTitle,
                content, question: `Generate flashcards about: ${deckTitle}`,
                tag: "flashcards", source: "turbo",
                date: new Date().toLocaleDateString(), pinned: false,
              });
            }} style={{
              padding: "12px 24px", borderRadius: 12, border: "none",
              background: `${t.secondary}15`, color: t.secondary, fontSize: 14, fontWeight: 600,
              cursor: "pointer", fontFamily: "'Poppins', sans-serif",
            }}>📂 Save to Notes</button>
          )}
          <button onClick={onClose} style={{
            padding: "12px 24px", borderRadius: 12, border: "none",
            background: t.gradient, color: "#fff", fontSize: 14, fontWeight: 600,
            cursor: "pointer", fontFamily: "'Poppins', sans-serif",
          }}>New Deck</button>
        </div>
      </div>
    );
  }

  if (!currentCard) return null;

  return (
    <div style={{ maxWidth: 580, margin: "0 auto" }}>
      {/* Deck header */}
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20,
      }}>
        <div>
          <h3 style={{ fontSize: 16, fontWeight: 700, color: t.text, marginBottom: 2 }}>{deckTitle}</h3>
          <span style={{ fontSize: 12, color: t.textMuted }}>
            Card {currentQueuePos + 1} of {studyQueue.length} • {knownCards.length} known
          </span>
        </div>
        <button onClick={onClose} style={{
          padding: "6px 14px", borderRadius: 8, border: `1px solid ${t.border}`,
          background: "transparent", color: t.textMuted, fontSize: 12, fontWeight: 500,
          cursor: "pointer", fontFamily: "'Poppins', sans-serif",
        }}>✕ Close</button>
      </div>

      {/* Progress bar */}
      <div style={{
        height: 6, background: t.inputBg, borderRadius: 3, overflow: "hidden", marginBottom: 24,
        display: "flex",
      }}>
        <div style={{
          width: `${cards.length > 0 ? (knownCards.length / cards.length) * 100 : 0}%`,
          height: "100%", background: t.success, transition: "width 0.4s ease",
        }} />
        <div style={{
          width: `${cards.length > 0 ? (studyAgainCards.length / cards.length) * 100 : 0}%`,
          height: "100%", background: t.danger, transition: "width 0.4s ease",
        }} />
      </div>

      {/* Card */}
      <Flashcard card={currentCard} flipped={flipped} onFlip={() => setFlipped(!flipped)} theme={theme} />

      {/* Action buttons */}
      <div style={{
        display: "flex", gap: 16, justifyContent: "center", marginTop: 24,
        opacity: flipped ? 1 : 0.3, pointerEvents: flipped ? "auto" : "none",
        transition: "opacity 0.3s",
      }}>
        <button onClick={() => markCard("study-again")} style={{
          display: "flex", alignItems: "center", gap: 8,
          padding: "14px 28px", borderRadius: 14, border: "none",
          background: `${t.danger}15`, color: t.danger,
          fontSize: 15, fontWeight: 600, cursor: "pointer",
          fontFamily: "'Poppins', sans-serif", transition: "all 0.2s",
          boxShadow: `0 4px 16px ${t.danger}10`,
        }}
          onMouseEnter={e => e.currentTarget.style.background = `${t.danger}25`}
          onMouseLeave={e => e.currentTarget.style.background = `${t.danger}15`}
        >
          <span style={{ fontSize: 18 }}>🔄</span> Study Again
        </button>
        <button onClick={() => markCard("known")} style={{
          display: "flex", alignItems: "center", gap: 8,
          padding: "14px 28px", borderRadius: 14, border: "none",
          background: `${t.success}15`, color: t.success,
          fontSize: 15, fontWeight: 600, cursor: "pointer",
          fontFamily: "'Poppins', sans-serif", transition: "all 0.2s",
          boxShadow: `0 4px 16px ${t.success}10`,
        }}
          onMouseEnter={e => e.currentTarget.style.background = `${t.success}25`}
          onMouseLeave={e => e.currentTarget.style.background = `${t.success}15`}
        >
          <span style={{ fontSize: 18 }}>✅</span> Know It
        </button>
      </div>

      {/* Hint text */}
      {!flipped && (
        <p style={{ textAlign: "center", color: t.textMuted, fontSize: 12, marginTop: 16, opacity: 0.6 }}>
          Click the card to flip it, then rate yourself
        </p>
      )}

      {/* Card counter dots */}
      <div style={{
        display: "flex", justifyContent: "center", gap: 6, marginTop: 20, flexWrap: "wrap",
      }}>
        {cards.map((c, i) => (
          <div key={i} style={{
            width: 8, height: 8, borderRadius: 4,
            background: c.status === "known" ? t.success :
              c.status === "study-again" ? t.danger :
              i === currentIndex ? t.primary : t.border,
            transition: "background 0.3s, transform 0.2s",
            transform: i === currentIndex ? "scale(1.4)" : "scale(1)",
          }} />
        ))}
      </div>
    </div>
  );
}

// ─── Flashcard View (replaces chat for turbo tool) ───
function FlashcardView({ theme, user, tokensUsed, tokenQuota, onTokenUpdate, onOutOfTokens, isDemo, savedDecks, setSavedDecks, onSaveNote }) {
  const t = themes[theme];
  const tool = AI_TOOLS.find(t => t.id === "turbo");
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [activeDeck, setActiveDeck] = useState(null);
  const [deckTitle, setDeckTitle] = useState("");

  const generateFlashcards = async () => {
    if (!input.trim() || loading) return;
    if (tokensUsed >= tokenQuota) { onOutOfTokens(); return; }

    const topic = input.trim();
    setInput(""); setLoading(true);

    if (isDemo) {
      await new Promise(r => setTimeout(r, 1000 + Math.random() * 1000));
      const cards = parseFlashcards(DEMO_RESPONSES.turbo);
      const fakeCost = Math.floor(120 + Math.random() * 100);
      onTokenUpdate(tokensUsed + fakeCost);
      const deck = { title: topic, cards, date: new Date().toLocaleDateString() };
      setSavedDecks([deck, ...savedDecks]);
      setDeckTitle(topic);
      setActiveDeck(cards);
      setLoading(false);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}${tool.endpoint}`, {
        method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${user.token}` },
        body: JSON.stringify({ message: `Create flashcards about: ${topic}` }),
      });
      const data = await res.json();
      if (data.error === "TOKEN_LIMIT_EXCEEDED") { onOutOfTokens(); }
      else {
        const cards = parseFlashcards(data.response || "");
        if (data.tokens_used != null) onTokenUpdate(data.tokens_used);
        if (cards.length > 0) {
          const deck = { title: topic, cards, date: new Date().toLocaleDateString() };
          setSavedDecks([deck, ...savedDecks]);
          setDeckTitle(topic);
          setActiveDeck(cards);
        }
      }
    } catch {
      // Error handling
    }
    setLoading(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1 }}>
      {/* Header */}
      <div style={{ padding: "16px 24px", borderBottom: `1px solid ${t.border}`, display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: 12, display: "flex",
          alignItems: "center", justifyContent: "center", fontSize: 22, background: `${tool.color}20`,
        }}>{tool.icon}</div>
        <div>
          <div style={{ fontSize: 17, fontWeight: 700, color: t.text }}>Flashcards</div>
          <div style={{ fontSize: 12, color: t.textMuted }}>Turbo AI • Interactive Study Cards</div>
        </div>
        {isDemo && <div style={{
          marginLeft: "auto", fontSize: 11, fontWeight: 600, padding: "4px 12px",
          borderRadius: 20, background: `${t.secondary}20`, color: t.secondary,
        }}>DEMO</div>}
      </div>

      <div style={{ flex: 1, overflow: "auto", padding: "24px" }}>
        {activeDeck ? (
          <FlashcardDeck
            cards={activeDeck}
            deckTitle={deckTitle}
            theme={theme}
            onClose={() => setActiveDeck(null)}
            onSaveNote={onSaveNote}
          />
        ) : (
          <div style={{ maxWidth: 600, margin: "0 auto" }}>
            {/* Generate new deck */}
            <div style={{
              background: t.card, borderRadius: 20, padding: "36px 28px",
              border: `1px solid ${t.border}`, textAlign: "center",
              boxShadow: t.cardShadow,
            }}>
              <div style={{ fontSize: 56, marginBottom: 16 }}>⚡</div>
              <h3 style={{ fontSize: 22, fontWeight: 700, color: t.text, marginBottom: 8 }}>Generate Flashcards</h3>
              <p style={{ color: t.textMuted, fontSize: 14, marginBottom: 24, lineHeight: 1.6 }}>
                Enter any topic and AI will create interactive flashcards for you.
                {isDemo && <span style={{ color: t.secondary, display: "block", marginTop: 8, fontWeight: 500 }}>
                  Demo mode — try any topic to see sample cards
                </span>}
              </p>

              <div style={{ display: "flex", gap: 12 }}>
                <input value={input} onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") generateFlashcards(); }}
                  placeholder="e.g. Cell Biology, French Revolution, JavaScript basics..."
                  style={{
                    flex: 1, padding: "14px 16px", borderRadius: 14, border: `1px solid ${t.border}`,
                    background: t.inputBg, color: t.text, fontSize: 15, fontFamily: "'Poppins', sans-serif",
                    outline: "none",
                  }} />
                <button onClick={generateFlashcards} disabled={loading || !input.trim()} style={{
                  padding: "14px 24px", borderRadius: 14, border: "none",
                  background: input.trim() ? t.gradient : t.inputBg,
                  color: input.trim() ? "#fff" : t.textMuted,
                  fontSize: 15, fontWeight: 600, cursor: input.trim() ? "pointer" : "default",
                  fontFamily: "'Poppins', sans-serif", whiteSpace: "nowrap",
                  boxShadow: input.trim() ? `0 4px 16px ${t.primary}30` : "none",
                }}>
                  {loading ? (
                    <span style={{ animation: "pulse 1.5s ease-in-out infinite" }}>Creating...</span>
                  ) : "Generate"}
                </button>
              </div>

              {/* Quick topic suggestions */}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginTop: 16 }}>
                {["Cell Biology", "World War II", "Python Basics", "Calculus", "Spanish Vocab"].map(topic => (
                  <button key={topic} onClick={() => setInput(topic)} style={{
                    padding: "5px 14px", borderRadius: 20, border: `1px solid ${t.border}`,
                    background: "transparent", color: t.textMuted, fontSize: 12,
                    cursor: "pointer", fontFamily: "'Poppins', sans-serif",
                    transition: "all 0.2s",
                  }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = t.primary; e.currentTarget.style.color = t.primary; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = t.border; e.currentTarget.style.color = t.textMuted; }}
                  >{topic}</button>
                ))}
              </div>
            </div>

            {/* Saved decks */}
            <SavedDecks
              decks={savedDecks}
              onSelectDeck={(deck) => { setDeckTitle(deck.title); setActiveDeck(deck.cards); }}
              onDeleteDeck={(i) => setSavedDecks(savedDecks.filter((_, idx) => idx !== i))}
              theme={theme}
            />
          </div>
        )}
      </div>
    </div>
  );
}

function ThemeToggle({ theme, toggle }) {

      padding: "8px", borderRadius: 8, display: "flex", alignItems: "center",

    }}
      onMouseEnter={e => e.currentTarget.style.transform = "rotate(30deg)"}

function TokenCounter({ used, quota, theme, compact }) {
  const t = themes[theme];
  const remaining = Math.max(0, quota - used);
  const remainPct = quota > 0 ? (remaining / quota) * 100 : 0;
  const barColor = remainPct < 10 ? t.danger : remainPct < 30 ? t.warning : t.success;
  const statusText = remainPct < 10 ? "Critical" : remainPct < 30 ? "Running low" : remainPct < 60 ? "Good" : "Healthy";
  const statusColor = remainPct < 10 ? t.danger : remainPct < 30 ? t.warning : t.success;

  if (compact) {
    return (
      <div style={{ padding: "0 6px" }}>
        <div style={{ height: 4, background: t.inputBg, borderRadius: 2, overflow: "hidden" }}>
          <div style={{ width: `${remainPct}%`, height: "100%", borderRadius: 2, background: barColor, transition: "width 0.5s ease" }} />
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: "0 6px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 10, color: t.textMuted, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase" }}>Tokens</span>
        <span style={{ fontSize: 10, color: statusColor, fontWeight: 600 }}>{statusText}</span>
      </div>
      <div style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 2 }}>
        {remaining.toLocaleString()}
      </div>
      <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 8 }}>
        of {quota.toLocaleString()} remaining
      </div>
      <div style={{ height: 6, background: t.inputBg, borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${remainPct}%`, height: "100%", borderRadius: 3, background: barColor, transition: "width 0.5s ease" }} />
      </div>
    </div>
  );
}

function AuthPage({ theme, onLogin, onToggleTheme }) {
  const t = themes[theme];
  const [isSignup, setIsSignup] = useState(true);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [verifyMode, setVerifyMode] = useState(false);
  const [verifyEmail, setVerifyEmail] = useState("");
  const [code, setCode] = useState(["", "", "", "", "", ""]);
  const codeRefs = [useRef(), useRef(), useRef(), useRef(), useRef(), useRef()];

  const handleCodeChange = (index, value) => {
    if (value.length > 1) value = value.slice(-1);
    if (value && !/^\d$/.test(value)) return;
    const newCode = [...code];
    newCode[index] = value;
    setCode(newCode);
    if (value && index < 5) codeRefs[index + 1].current && codeRefs[index + 1].current.focus();
  };

  const handleCodeKeyDown = (index, e) => {
    if (e.key === "Backspace" && !code[index] && index > 0) {
      codeRefs[index - 1].current && codeRefs[index - 1].current.focus();
    }
  };

  const handleSubmit = async () => {
    setLoading(true); setError("");
    try {
      const path = isSignup ? "/auth/signup" : "/auth/login";
      const body = isSignup ? { email, password, name } : { email, password };
      const res = await fetch(`${API_BASE}${path}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.error) { setError(data.error); }
      else if (data.requires_verification) {
        setVerifyEmail(data.email);
        setVerifyMode(true);
        setError("");
      } else {
        onLogin(data.token, data.user);
      }
    } catch { setError("Server not connected. Try the Demo Preview below!"); }
    setLoading(false);
  };

  const handleVerify = async () => {
    const fullCode = code.join("");
    if (fullCode.length !== 6) { setError("Please enter all 6 digits."); return; }
    setLoading(true); setError("");
    try {
      const res = await fetch(`${API_BASE}/auth/verify`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifyEmail, code: fullCode }),
      });
      const data = await res.json();
      if (data.error) setError(data.error);
      else onLogin(data.token, data.user);
    } catch { setError("Server not connected."); }
    setLoading(false);
  };

  const handleResend = async () => {
    setLoading(true); setError("");
    try {
      const res = await fetch(`${API_BASE}/auth/resend-code`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifyEmail }),
      });
      const data = await res.json();
      if (data.error) setError(data.error);
      else setError(""); 
    } catch { setError("Failed to resend."); }
    setLoading(false);
  };

  const handleDemo = () => {
    onLogin("demo-token", {
      id: 1, email: "student@demo.com", name: "Demo Student",
      subscription_status: "student", token_quota: 25000, tokens_used: 3420,
    });
  };

  const inputStyle = {

e="width:100%;height:100%;object-fit:cover;border-radius:inherit" /></div>
          <h1 style={{ fontSize: 32, fontWeight: 800, color: t.text, margin: "16px 0 4px" }}>studystack<span style="color:#4F8CFF">ai</span></h1>

            <>
              <h2 style={{ color: t.text, fontSize: 22, fontWeight: 700, marginBottom: 8, textAlign: "center" }}>Verify Your Email</h2>
              <p style={{ color: t.textMuted, fontSize: 13, textAlign: "center", marginBottom: 24, lineHeight: 1.5 }}>

              </p>
              {error && (
                <div style={{
                  background: `${t.danger}15`, border: `1px solid ${t.danger}40`,
                  borderRadius: 10, padding: "10px 14px", marginBottom: 16, color: t.danger, fontSize: 13,
                }}>{error}</div>
              )}
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 24 }}>
                {code.map((digit, i) => (
                  <input key={i} ref={codeRefs[i]} value={digit}
                    onChange={e => handleCodeChange(i, e.target.value)}
                    onKeyDown={e => handleCodeKeyDown(i, e)}
                    maxLength={1}
                    style={{
                      width: 48, height: 56, textAlign: "center", fontSize: 24, fontWeight: 700,
                      borderRadius: 12, border: `2px solid ${digit ? t.primary : t.border}`,
                      background: t.inputBg, color: t.text, outline: "none",
                      fontFamily: "'Poppins', sans-serif", transition: "border-color 0.2s",
                    }}
                  />
                ))}
              </div>
              <button onClick={handleVerify} disabled={loading} style={{
                width: "100%", padding: "14px", borderRadius: 12, border: "none",
                background: t.gradient, color: "#fff", fontSize: 16, fontWeight: 600,
                cursor: loading ? "wait" : "pointer", fontFamily: "'Poppins', sans-serif",
                opacity: loading ? 0.7 : 1, boxShadow: `0 4px 16px ${t.primary}40`,
              }}>{loading ? "Verifying..." : "Verify & Create Account"}</button>
              <div style={{ display: "flex", justifyContent: "center", gap: 16, marginTop: 16 }}>
                <span onClick={handleResend} style={{ color: t.primary, fontSize: 13, cursor: "pointer", fontWeight: 500 }}>Resend code</span>
                <span onClick={() => { setVerifyMode(false); setCode(["","","","","",""]); setError(""); }}
                  style={{ color: t.textMuted, fontSize: 13, cursor: "pointer" }}>Go back</span>
              </div>
            </>
          ) : (
            <>
              <h2 style={{ color: t.text, fontSize: 22, fontWeight: 700, marginBottom: 24, textAlign: "center" }}>
                {isSignup ? "Create Account" : "Welcome Back"}
              </h2>
              {error && (
                <div style={{
                  background: `${t.danger}15`, border: `1px solid ${t.danger}40`,
                  borderRadius: 10, padding: "10px 14px", marginBottom: 16, color: t.danger, fontSize: 13,
                }}>{error}</div>
              )}
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

                  background: t.gradient, color: "#fff", fontSize: 16, fontWeight: 600,
                  cursor: loading ? "wait" : "pointer", fontFamily: "'Poppins', sans-serif",

                  <span style={{ color: t.textMuted, fontSize: 12, fontWeight: 500 }}>OR</span>
                  <div style={{ flex: 1, height: 1, background: t.border }} />

                <button onClick={handleDemo} style={{
                  width: "100%", padding: "14px", borderRadius: 12,
                  border: `2px solid ${t.secondary}`, background: `${t.secondary}10`,
                  color: t.secondary, fontSize: 16, fontWeight: 600,
                  cursor: "pointer", fontFamily: "'Poppins', sans-serif", transition: "all 0.2s",

                  onMouseLeave={e => e.currentTarget.style.background = `${t.secondary}10`}
                >🚀 Preview Demo</button>
              </div>
              <p style={{ textAlign: "center", color: t.textMuted, fontSize: 14, marginTop: 20 }}>
                {isSignup ? "Already have an account?" : "Need an account?"}
                <span onClick={() => { setIsSignup(!isSignup); setError(""); }}
                  style={{ color: t.primary, cursor: "pointer", fontWeight: 600, marginLeft: 6 }}>
                  {isSignup ? "Log In" : "Sign Up"}
                </span>
              </p>
            </>
          )}

      </div>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
      `}</style>
    </div>
  );
}

function SubscriptionModal({ theme, currentPlan, onSelect, onClose }) {
  const t = themes[theme];
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 2000, display: "flex",
      alignItems: "center", justifyContent: "center", padding: 20,
      background: "rgba(0,0,0,0.6)", backdropFilter: "blur(8px)", fontFamily: "'Poppins', sans-serif",
    }} onClick={onClose}>
      <div style={{
        background: t.bg, borderRadius: 24, padding: "36px 28px", maxWidth: 920,
        width: "100%", border: `1px solid ${t.border}`, boxShadow: "0 24px 80px rgba(0,0,0,0.4)",
        maxHeight: "90vh", overflow: "auto",
      }} onClick={e => e.stopPropagation()}>
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <h2 style={{ fontSize: 28, fontWeight: 800, color: t.text }}>Choose Your Plan</h2>
          <p style={{ color: t.textMuted, marginTop: 8 }}>Unlock more AI-powered studying</p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 20 }}>
          {PLANS.map(plan => {
            const isActive = currentPlan === plan.id;
            return (
              <div key={plan.id} style={{
                background: t.card, borderRadius: 16, padding: "28px 24px",
                border: plan.popular ? `2px solid ${t.primary}` : `1px solid ${t.border}`,
                position: "relative", transition: "transform 0.2s",
                boxShadow: plan.popular ? `0 8px 32px ${t.primary}20` : t.cardShadow,
              }}
                onMouseEnter={e => e.currentTarget.style.transform = "translateY(-4px)"}
                onMouseLeave={e => e.currentTarget.style.transform = "translateY(0)"}
              >
                {plan.popular && (
                  <div style={{
                    position: "absolute", top: -12, left: "50%", transform: "translateX(-50%)",
                    background: t.gradient, color: "#fff", fontSize: 11, fontWeight: 700,
                    padding: "4px 16px", borderRadius: 20, letterSpacing: 1, textTransform: "uppercase",
                  }}>Most Popular</div>
                )}
                <h3 style={{ fontSize: 20, fontWeight: 700, color: t.text, marginBottom: 8 }}>{plan.name}</h3>
                <div style={{ marginBottom: 20 }}>
                  <span style={{ fontSize: 40, fontWeight: 800, color: t.text }}>${plan.price}</span>
                  <span style={{ color: t.textMuted, fontSize: 14 }}>/month</span>
                </div>
                <ul style={{ listStyle: "none", padding: 0, marginBottom: 24 }}>
                  {plan.features.map((f, i) => (
                    <li key={i} style={{ color: t.textMuted, fontSize: 14, padding: "6px 0", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: t.success, fontSize: 14 }}>✓</span> {f}
                    </li>
                  ))}
                </ul>
                <button onClick={() => onSelect(plan.id)} disabled={isActive} style={{
                  width: "100%", padding: "12px", borderRadius: 12, border: "none",
                  background: isActive ? t.inputBg : (plan.popular ? t.gradient : `${t.primary}20`),
                  color: isActive ? t.textMuted : (plan.popular ? "#fff" : t.primary),
                  fontSize: 15, fontWeight: 600, cursor: isActive ? "default" : "pointer",
                  fontFamily: "'Poppins', sans-serif",
                }}>{isActive ? "Current Plan" : plan.cta}</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function OutOfTokensModal({ theme, onUpgrade, onClose }) {
  const t = themes[theme];
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 2000, display: "flex",
      alignItems: "center", justifyContent: "center", padding: 20,

    }}>
      <div style={{
        background: t.card, borderRadius: 24, padding: "40px 32px", maxWidth: 420,
        width: "100%", border: `1px solid ${t.border}`, boxShadow: "0 24px 80px rgba(0,0,0,0.4)", textAlign: "center",
      }}>
        <div style={{ fontSize: 56, marginBottom: 16 }}>🚫</div>
        <h2 style={{ fontSize: 24, fontWeight: 800, color: t.text, marginBottom: 8 }}>Out of Tokens</h2>
        <p style={{ color: t.textMuted, fontSize: 15, marginBottom: 28, lineHeight: 1.6 }}>

        </p>
        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={onClose} style={{
            flex: 1, padding: "12px", borderRadius: 12, border: `1px solid ${t.border}`,

          <button onClick={onUpgrade} style={{
            flex: 1, padding: "12px", borderRadius: 12, border: "none",

        </div>
      </div>
    </div>

function NoteDetail({ note, theme, onBack, onDelete }) {
  const t = themes[theme];
  const tagColors = { general: t.primary, research: "#20B2AA", math: "#DD1100", writing: "#D97706", flashcards: "#EF4444", chatgpt: "#10A37F", perplexity: "#20B2AA", claude: "#D97706", turbo: "#EF4444", wolfram: "#DD1100" };
  const sourceNames = { chatgpt: "GPT-5.4", perplexity: "Perplexity AI", claude: "Claude AI", turbo: "GPT-4o Mini", wolfram: "Wolfram AI" };

  return (
    <div>
      <button onClick={onBack} style={{
        display: "flex", alignItems: "center", gap: 8, padding: "8px 16px",
        borderRadius: 10, border: `1px solid ${t.border}`, background: "transparent",
        color: t.textMuted, fontSize: 13, fontWeight: 500, cursor: "pointer",
        fontFamily: "'Poppins', sans-serif", marginBottom: 20, transition: "all 0.2s",
      }}
        onMouseEnter={e => { e.currentTarget.style.borderColor = t.primary; e.currentTarget.style.color = t.primary; }}
        onMouseLeave={e => { e.currentTarget.style.borderColor = t.border; e.currentTarget.style.color = t.textMuted; }}
      >← Back to notes</button>

      <div style={{
        background: t.card, borderRadius: 20, border: `1px solid ${t.border}`,
        overflow: "hidden",
      }}>
        {/* Header */}
        <div style={{
          padding: "28px 28px 20px", borderBottom: `1px solid ${t.border}`,
          display: "flex", justifyContent: "space-between", alignItems: "flex-start",
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
              <span style={{
                fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 6,
                background: `${tagColors[note.tag] || t.primary}20`, color: tagColors[note.tag] || t.primary,
                textTransform: "uppercase", letterSpacing: 0.5,
              }}>{note.tag}</span>
              {note.source && (
                <span style={{
                  fontSize: 11, fontWeight: 500, padding: "3px 10px", borderRadius: 6,
                  background: `${tagColors[note.source] || t.primary}15`, color: tagColors[note.source] || t.primary,
                }}>from {sourceNames[note.source] || note.source}</span>
              )}
              <span style={{ fontSize: 11, color: t.textMuted }}>{note.date}</span>
            </div>
            <h2 style={{ fontSize: 22, fontWeight: 700, color: t.text, lineHeight: 1.4 }}>{note.title}</h2>
          </div>
          <button onClick={() => { onDelete(note.id); onBack(); }} style={{
            background: "none", border: "none", cursor: "pointer", fontSize: 14,
            color: t.textMuted, padding: "4px 8px", flexShrink: 0,
          }}
            onMouseEnter={e => e.currentTarget.style.color = t.danger}
            onMouseLeave={e => e.currentTarget.style.color = t.textMuted}
          >🗑️ Delete</button>
        </div>

        {/* Question / prompt */}
        {note.question && (
          <div style={{
            padding: "16px 28px", borderBottom: `1px solid ${t.border}`,
            background: `${t.primary}06`,
          }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: t.primary, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Your Question</div>
            <p style={{ fontSize: 14, color: t.text, lineHeight: 1.6 }}>{note.question}</p>
          </div>
        )}

        {/* Full answer content */}
        <div style={{ padding: "24px 28px" }}>
          {note.question && (
            <div style={{ fontSize: 10, fontWeight: 600, color: t.success, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>AI Response</div>
          )}
          <div style={{
            fontSize: 15, color: t.text, lineHeight: 1.8, whiteSpace: "pre-wrap",
            fontFamily: "'Poppins', sans-serif",
          }}>
            {note.content}
          </div>
        </div>
      </div>
    </div>
  );
}

function StudyOrganizer({ theme, notes, setNotes }) {
  const t = themes[theme];
  const [newTitle, setNewTitle] = useState("");
  const [newContent, setNewContent] = useState("");
  const [newTag, setNewTag] = useState("general");
  const [filter, setFilter] = useState("all");
  const [selectedNote, setSelectedNote] = useState(null);
  const tags = ["general", "research", "math", "writing", "flashcards"];
  const tagColors = { general: t.primary, research: "#20B2AA", math: "#DD1100", writing: "#D97706", flashcards: "#EF4444", chatgpt: "#10A37F", perplexity: "#20B2AA", claude: "#D97706", turbo: "#EF4444", wolfram: "#DD1100" };
  const sourceIcons = { chatgpt: "🧠", perplexity: "🔍", claude: "✍️", turbo: "⚡", wolfram: "📐" };

  const addNote = () => {
    if (!newTitle.trim() || !newContent.trim()) return;
    setNotes([{ id: Date.now(), title: newTitle, content: newContent, tag: newTag, date: new Date().toLocaleDateString(), pinned: false }, ...notes]);
    setNewTitle(""); setNewContent("");
  };

  const filtered = notes.filter(n => filter === "all" || n.tag === filter).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

  if (selectedNote) {
    return (
      <NoteDetail
        note={selectedNote}
        theme={theme}
        onBack={() => setSelectedNote(null)}
        onDelete={(id) => setNotes(notes.filter(n => n.id !== id))}
      />
    );
  }

  const inputStyle = {
    padding: "12px 14px", borderRadius: 10, border: `1px solid ${t.border}`,
    background: t.inputBg, color: t.text, fontSize: 14, fontFamily: "'Poppins', sans-serif",
    outline: "none", width: "100%", boxSizing: "border-box",
  };

  return (
    <div>
      <div style={{ background: t.card, borderRadius: 16, padding: 24, marginBottom: 24, border: `1px solid ${t.border}` }}>
        <h3 style={{ color: t.text, fontSize: 16, fontWeight: 600, marginBottom: 16 }}>Add Study Note</h3>
        <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
          <input style={{ ...inputStyle, flex: 2, minWidth: 200 }} placeholder="Note title..." value={newTitle} onChange={e => setNewTitle(e.target.value)} />
          <select value={newTag} onChange={e => setNewTag(e.target.value)} style={{ ...inputStyle, flex: 0, minWidth: 130, cursor: "pointer" }}>
            {tags.map(tag => <option key={tag} value={tag}>{tag.charAt(0).toUpperCase() + tag.slice(1)}</option>)}
          </select>
        </div>
        <textarea style={{ ...inputStyle, minHeight: 80, resize: "vertical", marginBottom: 12 }}
          placeholder="Write your notes..." value={newContent} onChange={e => setNewContent(e.target.value)} />
        <button onClick={addNote} style={{
          padding: "10px 24px", borderRadius: 10, border: "none", background: t.gradient,
          color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "'Poppins', sans-serif",
        }}>Save Note</button>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        {["all", ...tags].map(tag => (
          <button key={tag} onClick={() => setFilter(tag)} style={{
            padding: "6px 16px", borderRadius: 20, border: `1px solid ${filter === tag ? t.primary : t.border}`,
            background: filter === tag ? `${t.primary}20` : "transparent",
            color: filter === tag ? t.primary : t.textMuted, fontSize: 13,
            fontWeight: 500, cursor: "pointer", fontFamily: "'Poppins', sans-serif",
          }}>{tag.charAt(0).toUpperCase() + tag.slice(1)}</button>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
        {filtered.map(note => (
          <div key={note.id} onClick={() => setSelectedNote(note)} style={{
            background: t.card, borderRadius: 14, padding: 20, cursor: "pointer",
            border: `1px solid ${note.pinned ? t.primary : t.border}`, transition: "transform 0.2s",
          }}
            onMouseEnter={e => e.currentTarget.style.transform = "translateY(-2px)"}
            onMouseLeave={e => e.currentTarget.style.transform = "translateY(0)"}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {note.source && <span style={{ fontSize: 14 }}>{sourceIcons[note.source] || ""}</span>}
                <span style={{
                  fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 6,
                  background: `${tagColors[note.tag] || t.primary}20`, color: tagColors[note.tag] || t.primary,
                  textTransform: "uppercase", letterSpacing: 0.5,
                }}>{note.tag}</span>
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={(e) => { e.stopPropagation(); setNotes(notes.map(n => n.id === note.id ? { ...n, pinned: !n.pinned } : n)); }} style={{
                  background: "none", border: "none", cursor: "pointer", fontSize: 16, padding: 4, opacity: note.pinned ? 1 : 0.4,
                }}>📌</button>
                <button onClick={(e) => { e.stopPropagation(); setNotes(notes.filter(n => n.id !== note.id)); }} style={{
                  background: "none", border: "none", cursor: "pointer", fontSize: 14, padding: 4, color: t.textMuted,
                }}>✕</button>
              </div>
            </div>
            <h4 style={{ color: t.text, fontSize: 16, fontWeight: 600, marginBottom: 8 }}>{note.title}</h4>
            <p style={{ color: t.textMuted, fontSize: 13, lineHeight: 1.6, marginBottom: 10, whiteSpace: "pre-wrap" }}>
              {note.content.length > 180 ? note.content.slice(0, 180) + "..." : note.content}
            </p>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ color: t.textMuted, fontSize: 11 }}>{note.date}</span>
              <span style={{ color: t.primary, fontSize: 11, fontWeight: 500 }}>Read more →</span>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <div style={{ gridColumn: "1/-1", textAlign: "center", padding: 60, color: t.textMuted }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>📝</div>
            <p style={{ fontSize: 15 }}>No notes yet. Save an AI response or add your own!</p>
          </div>
        )}
      </div>
    </div>
  );
}

function ChatView({ tool, theme, user, tokensUsed, tokenQuota, onTokenUpdate, onOutOfTokens, isDemo, onSaveNote }) {
  const t = themes[theme];
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [savedMsgIds, setSavedMsgIds] = useState(new Set());
  const endRef = useRef(null);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const sendMessage = async () => {
    if (!input.trim() || loading) return;
    if (tokensUsed >= tokenQuota) { onOutOfTokens(); return; }
    const userMsg = { role: "user", text: input, time: new Date().toLocaleTimeString() };
    setMessages(prev => [...prev, userMsg]);
    const currentInput = input;
    setInput(""); setLoading(true);

    if (isDemo) {
      await new Promise(r => setTimeout(r, 800 + Math.random() * 1200));
      const demoText = DEMO_RESPONSES[tool.id] || "This is a demo response!";
      const fakeCost = Math.floor(80 + Math.random() * 150);
      setMessages(prev => [...prev, { role: "assistant", text: demoText, time: new Date().toLocaleTimeString(), tokens: fakeCost }]);
      onTokenUpdate(tokensUsed + fakeCost);
      setLoading(false);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}${tool.endpoint}`, {
        method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${user.token}` },
        body: JSON.stringify({ message: currentInput }),
      });
      const data = await res.json();
      if (data.error === "TOKEN_LIMIT_EXCEEDED") { onOutOfTokens(); }
      else {
        setMessages(prev => [...prev, {
          role: "assistant", text: data.response || data.error || "No response",
          time: new Date().toLocaleTimeString(), tokens: data.tokens_used_this_request || 0,
        }]);
        if (data.tokens_used != null) onTokenUpdate(data.tokens_used);
      }
    } catch {
      setMessages(prev => [...prev, { role: "assistant", text: "Failed to reach the server.", time: new Date().toLocaleTimeString() }]);
    }
    setLoading(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1 }}>
      <div style={{ padding: "16px 24px", borderBottom: `1px solid ${t.border}`, display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: 12, display: "flex",
          alignItems: "center", justifyContent: "center", fontSize: 22, background: `${tool.color}20`,
        }}>{tool.icon}</div>
        <div>
          <div style={{ fontSize: 17, fontWeight: 700, color: t.text }}>{tool.name}</div>
          <div style={{ fontSize: 12, color: t.textMuted }}>{tool.subtitle} • Max 500 tokens/prompt</div>
        </div>
        {isDemo && <div style={{
          marginLeft: "auto", fontSize: 11, fontWeight: 600, padding: "4px 12px",
          borderRadius: 20, background: `${t.secondary}20`, color: t.secondary,
        }}>DEMO</div>}
      </div>
      <div style={{ flex: 1, overflow: "auto", padding: "20px 24px" }}>
        {messages.length === 0 && (
          <div style={{ textAlign: "center", padding: "80px 20px", color: t.textMuted }}>
            <div style={{ fontSize: 64, marginBottom: 16 }}>{tool.icon}</div>
            <h3 style={{ fontSize: 20, fontWeight: 600, color: t.text, marginBottom: 8 }}>{tool.name}</h3>
            <p style={{ fontSize: 14, maxWidth: 400, margin: "0 auto", lineHeight: 1.6 }}>{tool.desc}</p>
            {isDemo && <p style={{ fontSize: 13, color: t.secondary, marginTop: 16, fontWeight: 500 }}>Demo mode — type anything to see a sample response</p>}
          </div>
        )}
        {messages.map((msg, i) => (
          <div key={i} style={{ display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start", marginBottom: 16 }}>
            <div style={{
              maxWidth: "75%", padding: "14px 18px", borderRadius: 16,
              background: msg.role === "user" ? t.gradient : t.card,
              color: msg.role === "user" ? "#fff" : t.text,
              border: msg.role === "user" ? "none" : `1px solid ${t.border}`,
              fontSize: 14, lineHeight: 1.7, whiteSpace: "pre-wrap",
              borderBottomRightRadius: msg.role === "user" ? 4 : 16,
              borderBottomLeftRadius: msg.role === "user" ? 16 : 4,
            }}>
              {msg.text}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                <span style={{ fontSize: 10, opacity: 0.6 }}>
                  {msg.time}{msg.tokens ? ` • ${msg.tokens} tokens` : ""}
                </span>
                {msg.role === "assistant" && onSaveNote && (
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      const prevUserMsg = messages.slice(0, i).reverse().find(m => m.role === "user");
                      const title = prevUserMsg
                        ? prevUserMsg.text.slice(0, 60) + (prevUserMsg.text.length > 60 ? "..." : "")
                        : `${tool.name} response`;
                      const tagMap = { chatgpt: "general", perplexity: "research", claude: "writing", turbo: "flashcards", wolfram: "math" };
                      onSaveNote({
                        id: Date.now(),
                        title,
                        content: msg.text,
                        question: prevUserMsg && prevUserMsg.text || "",
                        tag: tagMap[tool.id] || "general",
                        source: tool.id,
                        date: new Date().toLocaleDateString(),
                        pinned: false,
                      });
                      setSavedMsgIds(prev => new Set([...prev, i]));
                    }}
                    disabled={savedMsgIds.has(i)}
                    style={{
                      background: savedMsgIds.has(i) ? `${t.success}15` : `${t.primary}15`,
                      border: "none", borderRadius: 6, padding: "3px 10px",
                      fontSize: 10, fontWeight: 600, cursor: savedMsgIds.has(i) ? "default" : "pointer",
                      color: savedMsgIds.has(i) ? t.success : t.primary,
                      fontFamily: "'Poppins', sans-serif", transition: "all 0.2s",
                    }}
                  >{savedMsgIds.has(i) ? "✓ Saved" : "📂 Save"}</button>
                )}
              </div>
            </div>
          </div>
        ))}
        {loading && (
          <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: 16 }}>
            <div style={{
              padding: "14px 18px", borderRadius: 16, background: t.card,
              border: `1px solid ${t.border}`, color: t.textMuted, fontSize: 14, borderBottomLeftRadius: 4,
            }}><span style={{ animation: "pulse 1.5s ease-in-out infinite" }}>Thinking...</span></div>
          </div>
        )}
        <div ref={endRef} />
      </div>
      <div style={{ padding: "16px 24px", borderTop: `1px solid ${t.border}`, display: "flex", gap: 12, alignItems: "flex-end" }}>
        <textarea value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
          placeholder={tool.placeholder} rows={1}
          style={{
            flex: 1, padding: "14px 16px", borderRadius: 14, border: `1px solid ${t.border}`,
            background: t.inputBg, color: t.text, fontSize: 15, fontFamily: "'Poppins', sans-serif",
            outline: "none", resize: "none", minHeight: 48, maxHeight: 120,
          }} />
        <button onClick={sendMessage} disabled={loading || !input.trim()} style={{
          width: 48, height: 48, borderRadius: 14, border: "none",
          background: input.trim() ? t.gradient : t.inputBg,
          color: input.trim() ? "#fff" : t.textMuted, fontSize: 20,
          cursor: input.trim() ? "pointer" : "default", display: "flex",
          alignItems: "center", justifyContent: "center", flexShrink: 0,
        }}>↑</button>
      </div>
    </div>
  );
}

              isDemo={isDemo}
              onSaveNote={(note) => setNotes(prev => [note, ...prev])} />
          )}
          {page === "flashcards" && (
            <FlashcardView theme={theme} user={user}
              tokensUsed={tokensUsed} tokenQuota={tokenQuota}
              onTokenUpdate={setTokensUsed} onOutOfTokens={() => setShowOutOfTokens(true)}
              isDemo={isDemo} savedDecks={savedDecks} setSavedDecks={setSavedDecks}
              onSaveNote={(note) => setNotes(prev => [note, ...prev])} />
          )}
          {page === "organizer" && (
            <div style={{ padding: "32px 24px 80px", maxWidth: 1100, margin: "0 auto" }}>
              <StudyOrganizer theme={theme} notes={notes} setNotes={setNotes} />
            </div>
          )}
          {page === "info" && (
            <div style={{ padding: "32px 24px 80px", maxWidth: 760, margin: "0 auto" }}>
              {/* Hero */}
              <div style={{
                background: t.gradient, borderRadius: 20, padding: "44px 36px",
                marginBottom: 32, position: "relative", overflow: "hidden", textAlign: "center",
              }}>
                <div style={{ position: "absolute", top: -30, right: -30, width: 160, height: 160, borderRadius: "50%", background: "rgba(255,255,255,0.1)" }} />
                <h1 style={{ fontSize: 28, fontWeight: 800, color: "#fff", marginBottom: 10, position: "relative" }}>
                  What is StudyStack AI?
                </h1>
                <p style={{ color: "rgba(255,255,255,0.85)", fontSize: 16, lineHeight: 1.7, position: "relative", maxWidth: 560, margin: "0 auto" }}>
                  Your all-in-one AI-powered study companion, built to help students learn smarter — not harder.
                </p>
              </div>

              {/* What it does */}
              <div style={{
                background: t.card, borderRadius: 16, padding: "28px 28px", marginBottom: 20,
                border: `1px solid ${t.border}`,
              }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 14 }}>How It Works</h3>
                <p style={{ color: t.textMuted, fontSize: 14, lineHeight: 1.8, marginBottom: 16 }}>
                  StudyStack AI brings together 5 specialized AI engines into one platform. Instead of switching between different tools, you get everything in one place — each AI optimized for a specific type of studying.
                </p>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {[
                    { icon: "🧠", name: "General Study", desc: "Ask questions, get explanations, and explore any topic with GPT-5.4." },
                    { icon: "🔍", name: "Research", desc: "Find verified academic sources, papers, and course materials with Perplexity AI." },
                    { icon: "✍️", name: "Writing", desc: "Draft essays, improve your writing, and get grammar help with Claude AI." },
                    { icon: "⚡", name: "Flashcards", desc: "Generate interactive, flippable study cards from any topic with GPT-4o Mini." },
                    { icon: "📐", name: "Math & Science", desc: "Solve problems step-by-step with Wolfram Alpha." },
                  ].map((item, i) => (
                    <div key={i} style={{ display: "flex", gap: 14, alignItems: "flex-start", padding: "10px 0" }}>
                      <span style={{ fontSize: 22, flexShrink: 0, marginTop: 2 }}>{item.icon}</span>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 600, color: t.text, marginBottom: 2 }}>{item.name}</div>
                        <div style={{ fontSize: 13, color: t.textMuted, lineHeight: 1.6 }}>{item.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Study Organizer */}
              <div style={{
                background: t.card, borderRadius: 16, padding: "28px 28px", marginBottom: 20,
                border: `1px solid ${t.border}`,
              }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 14 }}>Stay Organized</h3>
                <p style={{ color: t.textMuted, fontSize: 14, lineHeight: 1.8 }}>
                  Every answer you get from any AI tool can be saved to your personal Study Organizer with one click. Tag your notes, pin important ones, and revisit the full AI response anytime. Your flashcard decks are saved too — so you can study them again whenever you want.
                </p>
              </div>

              {/* Who it's for */}
              <div style={{
                background: t.card, borderRadius: 16, padding: "28px 28px", marginBottom: 20,
                border: `1px solid ${t.border}`,
              }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 14 }}>Who Is It For?</h3>
                <p style={{ color: t.textMuted, fontSize: 14, lineHeight: 1.8 }}>
                  StudyStack AI is designed for students at any level — whether you're in high school, university, or self-studying. If you need help understanding concepts, writing papers, solving equations, or memorizing material, this platform has a dedicated AI for each task.
                </p>
              </div>

              {/* Support */}
              <div style={{
                background: t.card, borderRadius: 16, padding: "28px 28px", marginBottom: 20,
                border: `1px solid ${t.border}`,
              }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 14 }}>Support</h3>
                <p style={{ color: t.textMuted, fontSize: 14, lineHeight: 1.8 }}>
                  Having trouble or have a question? We're here to help. Reach out to our support team and we'll get back to you as soon as possible.
                </p>
              </div>

              {/* Support email link */}
              <div style={{ textAlign: "center", padding: "12px 0 20px" }}>
                <a href="mailto:support@studystackai.com" style={{
                  color: t.primary, fontSize: 13, fontWeight: 500, textDecoration: "none",
                  transition: "opacity 0.2s",
                }}>
                  support@studystackai.com
                </a>
              </div>
            </div>
          )}
        </div>
      </div>


      {showPlans && (
        <SubscriptionModal theme={theme} currentPlan={currentPlan}
          onSelect={(id) => { setCurrentPlan(id); const p = PLANS.find(x=>x.id===id); if(p) setTokenQuota(p.tokens); setShowPlans(false); }}
          onClose={() => setShowPlans(false)} />
      )}
      {showOutOfTokens && (
        <OutOfTokensModal theme={theme}
          onUpgrade={() => { setShowOutOfTokens(false); setShowPlans(true); }}
          onClose={() => setShowOutOfTokens(false)} />
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: ${t.border}; border-radius: 3px; }
        html, body, #root { height: 100%; }
      `}</style>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
